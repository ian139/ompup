name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Ubuntu system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck openssh-server rsync tmux
          sudo install -d -m 0755 /run/sshd

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install shellcheck tmux
          test -x /usr/sbin/sshd
          rsync --version

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Bash syntax
        run: bun run check:bash

      - name: ShellCheck
        run: bun run check:shellcheck

      - name: CLI tests
        run: bun run test:cli

      - name: Extension tests
        run: bun run test:extension

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Disposable localhost SSH smoke
        run: bun run test:localhost-ssh

      - name: npm package dry-run and contents
        run: bun run pack:check
